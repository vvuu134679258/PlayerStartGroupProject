<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>队伍出生点编辑 Demo</title>
  <style>
    :root {
      --page: #101725;
      --surface: #182235;
      --surface-2: #202d44;
      --line: #33445f;
      --text: #eef4ff;
      --muted: #9eb0cc;
      --blue: #63a8ff;
      --blue-deep: #264d85;
      --orange: #ffb35c;
      --orange-deep: #774a1d;
      --danger: #ff7373;
      --grid: rgba(145, 177, 223, .11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--page);
      color: var(--text);
      font: 14px/1.45 Inter, "Microsoft YaHei", system-ui, sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      background: #141e2e;
    }

    .title-wrap h1 { margin: 0; font-size: 18px; font-weight: 650; }
    .title-wrap p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }

    .btn {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px 11px;
      background: var(--surface-2);
      color: var(--text);
    }
    .btn:hover { border-color: #6c86ae; }
    .btn.primary { background: var(--blue-deep); border-color: #4f89d7; }
    .btn.orange { background: var(--orange-deep); border-color: #c68a48; }
    .btn.danger { color: #ffd0d0; border-color: #85444c; background: #45282e; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
    }

    .map-wrap {
      min-height: 0;
      padding: 18px;
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 12px;
    }

    .layout-list {
      min-height: 590px;
      height: calc(100vh - 105px);
      overflow-y: auto;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #141e2e;
    }

    .layout-list h2 { margin: 0 0 4px; font-size: 14px; }
    .layout-list .hint { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
    .layout-list-items { display: grid; gap: 8px; }
    .layout-list-item {
      width: 100%;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-2);
      color: var(--text);
      text-align: left;
    }
    .layout-list-item:hover { border-color: #6c86ae; }
    .layout-list-item.active { border-color: var(--blue); background: rgba(38, 77, 133, .62); }
    .layout-list-item strong { display: block; margin-bottom: 4px; font-size: 12px; }
    .layout-list-item span { color: var(--muted); font-size: 11px; }
    .layout-list-empty { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
    .clear-layout-highlight { width: 100%; margin-top: 8px; padding: 6px; font-size: 12px; }

    .map {
      position: relative;
      min-height: 590px;
      height: calc(100vh - 105px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background-color: #162238;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        radial-gradient(ellipse at 35% 32%, rgba(90, 130, 183, .15), transparent 45%),
        radial-gradient(ellipse at 78% 72%, rgba(83, 142, 128, .13), transparent 44%);
      background-size: 32px 32px, 32px 32px, auto, auto;
      background-position: 0 0, 0 0, center, center;
      cursor: grab;
    }

    .scene {
      position: absolute;
      inset: 0;
      transform-origin: 0 0;
    }

    .map.is-panning { cursor: grabbing; }

    .map::before {
      content: "地图编辑区域";
      position: absolute;
      left: 18px;
      top: 14px;
      color: rgba(221, 233, 250, .48);
      letter-spacing: .1em;
      font-size: 11px;
      pointer-events: none;
    }

    .entity {
      position: absolute;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      user-select: none;
      touch-action: none;
      cursor: grab;
    }

    .entity.selected { z-index: 3; }
    .entity.selected::after {
      content: "";
      position: absolute;
      inset: -7px;
      border: 2px solid #e6f0ff;
      border-radius: 10px;
      box-shadow: 0 0 0 3px rgba(99, 168, 255, .35);
      pointer-events: none;
    }

    .spawn {
      width: 42px;
      height: 42px;
      border: 2px solid #b8d8ff;
      border-radius: 50%;
      background: var(--blue-deep);
      color: #f3f8ff;
      font-weight: 700;
    }

    .spawn.layout-member {
      z-index: 2;
      border-color: #fff0c0;
      box-shadow: 0 0 0 4px rgba(255, 179, 92, .55), 0 0 18px rgba(255, 179, 92, .4);
    }

    .spawn.layout-excluded { opacity: .35; }

    .spawn .pin {
      position: absolute;
      top: -7px;
      width: 9px;
      height: 9px;
      border: 2px solid #b8d8ff;
      border-radius: 50%;
      background: var(--blue-deep);
    }

    .building {
      min-width: 72px;
      min-height: 52px;
      border: 2px solid #ffd295;
      border-radius: 5px;
      background: repeating-linear-gradient(135deg, #68461f 0, #68461f 8px, #785227 8px, #785227 16px);
      color: #fff5e6;
      font-weight: 700;
    }

    .entity-label {
      position: absolute;
      top: calc(100% + 8px);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      background: rgba(11, 17, 28, .82);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      pointer-events: none;
    }

    .legend {
      position: absolute;
      left: 16px;
      bottom: 14px;
      display: flex;
      gap: 13px;
      align-items: center;
      padding: 7px 9px;
      border: 1px solid rgba(137, 161, 195, .35);
      border-radius: 6px;
      background: rgba(13, 20, 32, .76);
      color: var(--muted);
      font-size: 12px;
      pointer-events: none;
    }

    .zoom-status {
      position: absolute;
      right: 16px;
      bottom: 14px;
      padding: 7px 9px;
      border: 1px solid rgba(137, 161, 195, .35);
      border-radius: 6px;
      background: rgba(13, 20, 32, .76);
      color: var(--muted);
      font-size: 12px;
      pointer-events: none;
    }

    .legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; }
    .legend .dot { border-radius: 50%; background: var(--blue); }
    .legend .block { background: var(--orange); }

    .panel {
      min-height: 0;
      overflow-y: auto;
      border-left: 1px solid var(--line);
      background: #141e2e;
      padding: 18px;
    }

    .panel h2 { margin: 0 0 4px; font-size: 15px; }
    .panel .hint { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
    .empty { padding-top: 12px; color: var(--muted); }

    .type-pill {
      display: inline-block;
      margin: 2px 0 18px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 12px;
    }

    .field { display: grid; gap: 6px; margin-bottom: 15px; }
    .field label { color: var(--muted); font-size: 12px; }
    .field input, .field textarea {
      width: 100%;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
      background: var(--surface-2);
      color: var(--text);
    }
    .field textarea { min-height: 150px; resize: vertical; font: 11px/1.45 ui-monospace, Consolas, monospace; }
    .field input:focus, .field textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(99, 168, 255, .18); }

    .coordinates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .coordinates .field { margin-bottom: 15px; }
    .validation { min-height: 18px; color: var(--danger); font-size: 12px; }

    .panel-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .panel-section h2 { margin-bottom: 4px; }
    .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .config-grid .field { margin-bottom: 10px; }
    .config-grid .field input, .rule-card input, .rule-card select { width: 100%; }
    .section-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
    .section-actions .btn:last-child { grid-column: 1 / -1; }
    .rule-card {
      margin: 10px 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(32, 45, 68, .56);
    }
    .rule-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
    .rule-card-head strong { font-size: 12px; }
    .rule-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .rule-row:last-child { margin-bottom: 0; }
    .rule-row .field { margin: 0; }
    .rule-row label { color: var(--muted); font-size: 11px; }
    .rule-card .btn { padding: 5px 8px; font-size: 12px; }
    .rule-description { margin: 7px 0 0; color: var(--muted); font-size: 11px; }
    .layout-results { display: grid; gap: 8px; margin-top: 12px; }
    .layout-result {
      padding: 10px;
      border: 1px solid rgba(99, 168, 255, .45);
      border-radius: 8px;
      background: rgba(38, 77, 133, .22);
    }
    .layout-result strong { display: block; margin-bottom: 5px; font-size: 12px; }
    .layout-result p, .layout-points, .result-message { margin: 0; color: var(--muted); font-size: 12px; }
    .tag-chip {
      display: inline-block;
      margin: 3px 4px 0 0;
      padding: 1px 5px;
      border: 1px solid rgba(99, 168, 255, .5);
      border-radius: 999px;
      color: #cfe5ff;
      font-size: 11px;
    }
    .empty-rule { margin: 10px 0; color: var(--muted); font-size: 12px; }
    .config-transfer { margin-top: 16px; }
    .transfer-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .transfer-message { min-height: 18px; margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .transfer-message.error { color: var(--danger); }

    @media (max-width: 760px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .workspace { grid-template-columns: 1fr; }
      .map-wrap { grid-template-columns: 1fr; }
      .layout-list { min-height: 0; height: auto; max-height: 240px; }
      .map { height: 62vh; min-height: 440px; }
      .panel { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-wrap">
        <h1>队伍出生点编辑 Demo</h1>
        <p>当前仅维护出生点与建筑物；队伍分配逻辑尚未接入。</p>
      </div>
      <div class="toolbar" aria-label="编辑工具">
        <button class="btn primary" id="add-spawn" type="button">＋ 新增出生点</button>
        <button class="btn orange" id="add-building" type="button">＋ 新增建筑物</button>
        <button class="btn danger" id="delete-selected" type="button">删除选中</button>
        <button class="btn" id="toggle-edit-lock" type="button" aria-pressed="false">锁定编辑</button>
      </div>
    </header>

    <section class="workspace">
      <div class="map-wrap">
        <aside class="layout-list" id="layout-list" aria-live="polite"></aside>
        <div class="map" id="map" aria-label="可编辑地图。拖动出生点或建筑物可改变位置。按住 Ctrl 并滚动鼠标滚轮可缩放地图。">
          <div class="scene" id="scene"></div>
          <div class="legend" aria-hidden="true">
            <span><i class="dot"></i>出生组</span>
            <span><i class="block"></i>建筑物</span>
          </div>
          <div class="zoom-status">Ctrl + 滚轮 · <span id="zoom-level">100%</span></div>
        </div>
      </div>
      <aside class="panel" aria-live="polite">
        <section>
          <h2>属性</h2>
          <p class="hint">选中地图对象后，可实时修改编号、位置和出生点 Tag。</p>
          <div id="properties"></div>
        </section>
        <section class="panel-section" aria-labelledby="layout-config-title">
          <h2 id="layout-config-title">全局布局约束</h2>
          <p class="hint">先配置“哪些点能同时激活”，再生成合法的 N 点出生布局。</p>
          <div id="layout-config"></div>
        </section>
      </aside>
    </section>
  </main>

  <script>
    // 当前的地图数据只保存在浏览器内存中。后续接入存档或服务端时，
    // 可将 entities 序列化为 JSON，并在页面初始化时恢复。
    const entities = [
      { uid: 'spawn-1', type: 'spawn', groupId: 1, x: 18, y: 28, tags: ['Aggressive_Core', 'CoreAnchor'] },
      { uid: 'spawn-2', type: 'spawn', groupId: 2, x: 79, y: 25, tags: ['EdgeLoot'] },
      { uid: 'spawn-3', type: 'spawn', groupId: 3, x: 46, y: 68, tags: ['MiddleTactical'] },
      // 建筑物宽高使用像素，避免随地图容器宽高变化而被拉伸。
      { uid: 'building-1', type: 'building', buildingId: 1, x: 35, y: 35, w: 180, h: 78 },
      { uid: 'building-2', type: 'building', buildingId: 2, x: 66, y: 58, w: 210, h: 86 },
      { uid: 'building-3', type: 'building', buildingId: 3, x: 21, y: 73, w: 165, h: 72 }
    ];

    const map = document.getElementById('map');
    const scene = document.getElementById('scene');
    const zoomLevel = document.getElementById('zoom-level');
    const properties = document.getElementById('properties');
    const layoutConfigElement = document.getElementById('layout-config');
    const layoutListElement = document.getElementById('layout-list');
    const deleteButton = document.getElementById('delete-selected');
    const editLockButton = document.getElementById('toggle-edit-lock');
    const layoutConfig = {
      targetCount: 2,
      maxLayouts: 12,
      rules: []
    };
    let generatedLayouts = null;
    let selectedLayoutIndex = null;
    let isEditingLocked = false;
    let configJsonText = '';
    let configTransferMessage = '';
    let configTransferIsError = false;
    let selectedUid = null;
    let dragging = null;
    let panning = null;
    // zoom 为地图比例；panX / panY 为地图左上角在视口中的像素偏移。
    const view = { zoom: 1, panX: 0, panY: 0 };

    function selectedEntity() {
      return entities.find((entity) => entity.uid === selectedUid) || null;
    }

    function selectedLayout() {
      if (!generatedLayouts || !Number.isInteger(selectedLayoutIndex)) return null;
      return generatedLayouts.layouts[selectedLayoutIndex] || null;
    }

    function invalidateGeneratedLayouts() {
      generatedLayouts = null;
      selectedLayoutIndex = null;
    }

    function spawnPoints() {
      return entities.filter((entity) => entity.type === 'spawn');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      })[character]);
    }

    function normalizeTags(rawValue) {
      const values = Array.isArray(rawValue) ? rawValue : String(rawValue).split(/[,，]/);
      const seen = new Set();
      return values.reduce((tags, value) => {
        const tag = String(value).trim();
        const key = tag.toLocaleLowerCase();
        if (tag && !seen.has(key)) {
          seen.add(key);
          tags.push(tag);
        }
        return tags;
      }, []);
    }

    function tagsMatch(point, tags) {
      const expected = new Set(normalizeTags(tags).map((tag) => tag.toLocaleLowerCase()));
      return point.tags.some((tag) => expected.has(tag.toLocaleLowerCase()));
    }

    function nextId(key) {
      return Math.max(0, ...entities.filter((entity) => entity.type === key.type)
        .map((entity) => Number(entity[key.field]) || 0)) + 1;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function idIsDuplicated(entity) {
      const field = entity.type === 'spawn' ? 'groupId' : 'buildingId';
      return entities.some((other) => other.uid !== entity.uid && other.type === entity.type && String(other[field]) === String(entity[field]));
    }

    function entityLabel(entity) {
      if (entity.type === 'building') return `建筑物 ${entity.buildingId}`;
      const tagSuffix = entity.tags.length ? `，Tag：${entity.tags.join('、')}` : '';
      return `GroupId ${entity.groupId}${tagSuffix}`;
    }

    function renderMap() {
      // 先清空并重建对象，保证选中态、编号和坐标始终来自 entities 单一数据源。
      scene.querySelectorAll('[data-entity]').forEach((node) => node.remove());
      const activeLayout = selectedLayout();
      const activeLayoutPointIds = new Set(activeLayout ? activeLayout.points.map((point) => point.uid) : []);
      entities.forEach((entity) => {
        const node = document.createElement('button');
        node.type = 'button';
        const layoutClass = entity.type === 'spawn' && activeLayout
          ? (activeLayoutPointIds.has(entity.uid) ? ' layout-member' : ' layout-excluded')
          : '';
        node.className = `entity ${entity.type}${entity.uid === selectedUid ? ' selected' : ''}${layoutClass}`;
        node.dataset.entity = entity.uid;
        node.setAttribute('aria-label', entityLabel(entity));
        node.style.left = `${entity.x}%`;
        node.style.top = `${entity.y}%`;
        if (entity.type === 'building') {
          node.style.width = `${entity.w}px`;
          node.style.height = `${entity.h}px`;
          node.innerHTML = `<span>B${entity.buildingId}</span><span class="entity-label">建筑物 ${entity.buildingId}</span>`;
        } else {
          node.innerHTML = `<span class="pin"></span><span>${entity.groupId}</span><span class="entity-label">GroupId ${entity.groupId}</span>`;
        }
        node.addEventListener('pointerdown', beginDrag);
        node.addEventListener('click', (event) => event.stopPropagation());
        scene.appendChild(node);
      });
    }

    function applyView() {
      // 实体由 scene 整体变换；网格在 map 背景层单独同步，避免缩放时出现错位。
      scene.style.transform = `translate(${view.panX}px, ${view.panY}px) scale(${view.zoom})`;
      const gridSize = 32 * view.zoom;
      map.style.backgroundSize = `${gridSize}px ${gridSize}px, ${gridSize}px ${gridSize}px, auto, auto`;
      map.style.backgroundPosition = `${view.panX}px ${view.panY}px, ${view.panX}px ${view.panY}px, center, center`;
      zoomLevel.textContent = `${Math.round(view.zoom * 100)}%`;
    }

    function renderProperties() {
      const entity = selectedEntity();
      deleteButton.disabled = !entity || isEditingLocked;
      if (!entity) {
        properties.innerHTML = '<p class="empty">请选择一个出生点或建筑物。</p>';
        return;
      }

      const isSpawn = entity.type === 'spawn';
      const idField = isSpawn ? 'groupId' : 'buildingId';
      const idLabel = isSpawn ? '出生组 GroupId' : '建筑物编号';
      const duplicateWarning = idIsDuplicated(entity) ? `${idLabel} 不能与同类对象重复。` : '';
      const spawnFields = isSpawn ? `
        <div class="field">
          <label for="spawn-tags">点位 Tags（逗号分隔）</label>
          <input id="spawn-tags" type="text" value="${escapeHtml(entity.tags.join(', '))}" placeholder="例如：Aggressive_Core, EdgeLoot">
        </div>` : '';
      const buildingFields = isSpawn ? '' : `
        <div class="coordinates">
          <div class="field"><label for="width">宽度（px）</label><input id="width" data-field="w" type="number" min="48" max="640" step="1" value="${entity.w}"></div>
          <div class="field"><label for="height">高度（px）</label><input id="height" data-field="h" type="number" min="36" max="420" step="1" value="${entity.h}"></div>
        </div>`;

      properties.innerHTML = `
        <span class="type-pill">${isSpawn ? '出生点 Actor' : '建筑物 Actor'}</span>
        <div class="field">
          <label for="entity-id">${idLabel}</label>
          <input id="entity-id" data-field="${idField}" type="number" min="1" step="1" value="${entity[idField]}">
        </div>
        <div class="coordinates">
          <div class="field"><label for="pos-x">X（%）</label><input id="pos-x" data-field="x" type="number" min="0" max="100" step="1" value="${Math.round(entity.x)}"></div>
          <div class="field"><label for="pos-y">Y（%）</label><input id="pos-y" data-field="y" type="number" min="0" max="100" step="1" value="${Math.round(entity.y)}"></div>
        </div>
        ${spawnFields}
        ${buildingFields}
        <div class="validation" id="validation">${duplicateWarning}</div>`;

      properties.querySelectorAll('[data-field]').forEach((input) => {
        input.addEventListener('input', () => updateField(input.dataset.field, input.value));
        input.addEventListener('change', render);
      });
      const tagsInput = document.getElementById('spawn-tags');
      if (tagsInput) {
        tagsInput.addEventListener('input', () => updateSpawnTags(tagsInput.value));
        tagsInput.addEventListener('change', render);
      }
      if (isEditingLocked) properties.querySelectorAll('input').forEach((input) => { input.disabled = true; });
    }

    function updateField(field, rawValue) {
      const entity = selectedEntity();
      const value = Number(rawValue);
      if (!entity || !Number.isFinite(value) || isEditingLocked) return;
      if (field === 'x' || field === 'y') entity[field] = clamp(value, 0, 100);
      else if (field === 'w') entity.w = clamp(value, 48, 640);
      else if (field === 'h') entity.h = clamp(value, 36, 420);
      else entity[field] = Math.max(1, Math.round(value));
      if (entity.type === 'spawn' && field === 'groupId') invalidateGeneratedLayouts();
      renderMap();
      const validation = document.getElementById('validation');
      if (validation) {
        const idLabel = entity.type === 'spawn' ? '出生组 GroupId' : '建筑物编号';
        validation.textContent = idIsDuplicated(entity) ? `${idLabel} 不能与同类对象重复。` : '';
      }
    }

    function updateSpawnTags(rawValue) {
      const entity = selectedEntity();
      if (!entity || entity.type !== 'spawn' || isEditingLocked) return;
      entity.tags = normalizeTags(rawValue);
      invalidateGeneratedLayouts();
      renderMap();
    }

    function renderLayoutList() {
      if (!generatedLayouts) {
        layoutListElement.innerHTML = '<h2>合法布局</h2><p class="hint">生成候选布局后，可在这里点击高亮对应出生点。</p><p class="layout-list-empty">暂未生成布局。</p>';
        return;
      }
      if (generatedLayouts.errors.length) {
        layoutListElement.innerHTML = `<h2>合法布局</h2><p class="hint">请先修正右侧约束配置。</p><p class="layout-list-empty">${generatedLayouts.errors.map(escapeHtml).join('；')}</p>`;
        return;
      }
      if (!generatedLayouts.layouts.length) {
        layoutListElement.innerHTML = '<h2>合法布局</h2><p class="hint">当前约束下没有可用组合。</p><p class="layout-list-empty">请调整点位或全局约束后重新生成。</p>';
        return;
      }
      const items = generatedLayouts.layouts.map((layout, index) => {
        const groupIds = layout.points.map((point) => `GroupId ${point.groupId}`).join('、');
        return `<button class="layout-list-item${index === selectedLayoutIndex ? ' active' : ''}" type="button" data-layout-index="${index}"><strong>方案 ${index + 1}</strong><span>${groupIds}</span></button>`;
      }).join('');
      const clearButton = selectedLayout() ? '<button class="btn clear-layout-highlight" type="button" data-clear-layout-highlight="true">清除地图高亮</button>' : '';
      layoutListElement.innerHTML = `<h2>合法布局</h2><p class="hint">找到 ${generatedLayouts.validCount} 个，显示前 ${generatedLayouts.layouts.length} 个。</p><div class="layout-list-items">${items}</div>${clearButton}`;
    }

    function updateEditingLockUi() {
      editLockButton.textContent = isEditingLocked ? '解锁编辑' : '锁定编辑';
      editLockButton.setAttribute('aria-pressed', String(isEditingLocked));
      document.getElementById('add-spawn').disabled = isEditingLocked;
      document.getElementById('add-building').disabled = isEditingLocked;
      deleteButton.disabled = !selectedEntity() || isEditingLocked;
    }

    function render() {
      renderMap();
      renderProperties();
      renderGlobalConfig();
      renderLayoutList();
      updateEditingLockUi();
    }

    function beginDrag(event) {
      if (event.button !== 0) return;
      event.preventDefault();
      event.stopPropagation();
      const uid = event.currentTarget.dataset.entity;
      const entity = entities.find((item) => item.uid === uid);
      if (!entity) return;
      if (isEditingLocked) {
        selectedUid = uid;
        render();
        return;
      }
      selectedUid = uid;
      const rect = map.getBoundingClientRect();
      // offset 保留鼠标与对象中心的屏幕距离，拖拽时可避免对象突然跳到鼠标中心。
      dragging = {
        uid,
        offsetX: event.clientX - rect.left - view.panX - (entity.x / 100) * rect.width * view.zoom,
        offsetY: event.clientY - rect.top - view.panY - (entity.y / 100) * rect.height * view.zoom
      };
      render();
    }

    function moveEntity(event) {
      if (panning) {
        // 右键平移直接更新视图偏移；实体坐标保持不变。
        view.panX = panning.panX + event.clientX - panning.startX;
        view.panY = panning.panY + event.clientY - panning.startY;
        applyView();
        return;
      }
      if (!dragging) return;
      const entity = entities.find((item) => item.uid === dragging.uid);
      if (!entity) return;
      const rect = map.getBoundingClientRect();
      // 将屏幕坐标反算为未缩放地图内的百分比坐标。
      entity.x = clamp(((event.clientX - rect.left - view.panX - dragging.offsetX) / (rect.width * view.zoom)) * 100, 2, 98);
      entity.y = clamp(((event.clientY - rect.top - view.panY - dragging.offsetY) / (rect.height * view.zoom)) * 100, 3, 96);
      renderMap();
      const xInput = document.querySelector('[data-field="x"]');
      const yInput = document.querySelector('[data-field="y"]');
      if (xInput) xInput.value = Math.round(entity.x);
      if (yInput) yInput.value = Math.round(entity.y);
    }

    function endDrag() {
      dragging = null;
      if (panning) {
        panning = null;
        map.classList.remove('is-panning');
      }
    }

    function beginPan(event) {
      if (event.button !== 2) return;
      event.preventDefault();
      dragging = null;
      panning = { startX: event.clientX, startY: event.clientY, panX: view.panX, panY: view.panY };
      map.classList.add('is-panning');
    }

    function zoomMap(event) {
      if (!event.ctrlKey) return;
      event.preventDefault();
      const rect = map.getBoundingClientRect();
      const cursorX = event.clientX - rect.left;
      const cursorY = event.clientY - rect.top;
      // 以鼠标所在的地图坐标为缩放中心，因此缩放时该位置保持在鼠标下方。
      const worldX = (cursorX - view.panX) / view.zoom;
      const worldY = (cursorY - view.panY) / view.zoom;
      const factor = event.deltaY < 0 ? 1.12 : 0.89;
      const nextZoom = clamp(view.zoom * factor, 0.55, 2.5);
      view.panX = cursorX - worldX * nextZoom;
      view.panY = cursorY - worldY * nextZoom;
      view.zoom = nextZoom;
      applyView();
    }

    function makeRuleId() {
      return `rule-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
    }

    function createConfigSnapshot() {
      return {
        schemaVersion: 1,
        entities: entities.map((entity) => entity.type === 'spawn'
          ? { uid: entity.uid, type: 'spawn', groupId: entity.groupId, x: entity.x, y: entity.y, tags: [...entity.tags] }
          : { uid: entity.uid, type: 'building', buildingId: entity.buildingId, x: entity.x, y: entity.y, w: entity.w, h: entity.h }),
        layoutConfig: {
          targetCount: layoutConfig.targetCount,
          maxLayouts: layoutConfig.maxLayouts,
          rules: layoutConfig.rules.map((rule) => ({ ...rule, pointIds: rule.pointIds ? [...rule.pointIds] : undefined, tags: rule.tags ? [...rule.tags] : undefined }))
        }
      };
    }

    function readFiniteNumber(value, label) {
      const number = Number(value);
      if (!Number.isFinite(number)) throw new Error(`${label} 必须是有效数字。`);
      return number;
    }

    function readPositiveInteger(value, label) {
      const number = readFiniteNumber(value, label);
      if (!Number.isInteger(number) || number < 1) throw new Error(`${label} 必须是大于 0 的整数。`);
      return number;
    }

    function normalizeImportedEntity(source, index, usedUids, usedSpawnIds, usedBuildingIds) {
      if (!source || typeof source !== 'object') throw new Error(`第 ${index + 1} 个地图对象无效。`);
      const uid = String(source.uid || '').trim();
      if (!uid || usedUids.has(uid)) throw new Error(`第 ${index + 1} 个地图对象缺少唯一 uid。`);
      usedUids.add(uid);
      const x = clamp(readFiniteNumber(source.x, `${uid} 的 X`), 0, 100);
      const y = clamp(readFiniteNumber(source.y, `${uid} 的 Y`), 0, 100);

      if (source.type === 'spawn') {
        const groupId = readPositiveInteger(source.groupId, `${uid} 的 GroupId`);
        if (usedSpawnIds.has(groupId)) throw new Error(`GroupId ${groupId} 重复。`);
        usedSpawnIds.add(groupId);
        return { uid, type: 'spawn', groupId, x, y, tags: normalizeTags(source.tags || []) };
      }

      if (source.type === 'building') {
        const buildingId = readPositiveInteger(source.buildingId, `${uid} 的建筑物编号`);
        if (usedBuildingIds.has(buildingId)) throw new Error(`建筑物编号 ${buildingId} 重复。`);
        usedBuildingIds.add(buildingId);
        return {
          uid,
          type: 'building',
          buildingId,
          x,
          y,
          w: clamp(readFiniteNumber(source.w, `${uid} 的宽度`), 48, 640),
          h: clamp(readFiniteNumber(source.h, `${uid} 的高度`), 36, 420)
        };
      }
      throw new Error(`${uid} 的对象类型必须是 spawn 或 building。`);
    }

    function normalizeImportedRule(source, index, validSpawnUids) {
      if (!source || typeof source !== 'object') throw new Error(`第 ${index + 1} 条约束无效。`);
      const id = String(source.id || makeRuleId());
      const ensurePoint = (uid, label) => {
        if (!validSpawnUids.has(uid)) throw new Error(`第 ${index + 1} 条约束的 ${label} 不存在。`);
        return uid;
      };

      if (source.type === 'activation') {
        const mode = source.mode === 'blocked' ? 'blocked' : 'required';
        return { id, type: 'activation', mode, pointId: ensurePoint(source.pointId, '出生点') };
      }

      if (source.type === 'count') {
        const scope = source.scope === 'tags' ? 'tags' : 'points';
        const comparison = ['exactly', 'atLeast', 'atMost'].includes(source.comparison) ? source.comparison : 'exactly';
        const value = clamp(Math.round(readFiniteNumber(source.value, `第 ${index + 1} 条约束的数量`)), 0, 32);
        if (scope === 'tags') {
          const tags = normalizeTags(source.tags || []);
          if (!tags.length) throw new Error(`第 ${index + 1} 条 Tag 数量约束没有填写 Tag。`);
          return { id, type: 'count', scope, pointIds: [], invalidGroupIds: [], tags, comparison, value };
        }
        const pointIds = [...new Set(Array.isArray(source.pointIds) ? source.pointIds.map(String) : [])];
        if (!pointIds.length) throw new Error(`第 ${index + 1} 条点位数量约束没有选择出生点。`);
        pointIds.forEach((uid) => ensurePoint(uid, '出生点'));
        return { id, type: 'count', scope, pointIds, invalidGroupIds: [], tags: [], comparison, value };
      }

      if (source.type === 'relation') {
        const relation = ['exclusive', 'bound', 'requires', 'disables'].includes(source.relation) ? source.relation : 'exclusive';
        const sourceId = ensurePoint(source.sourceId, '起点');
        const targetId = ensurePoint(source.targetId, '目标');
        if (sourceId === targetId) throw new Error(`第 ${index + 1} 条点位关系的起点和目标不能相同。`);
        return { id, type: 'relation', relation, sourceId, targetId };
      }

      throw new Error(`第 ${index + 1} 条约束类型无效。`);
    }

    function exportConfigJson() {
      configJsonText = JSON.stringify(createConfigSnapshot(), null, 2);
      configTransferMessage = '已生成完整配置 JSON，可复制保存；需要恢复时粘贴后点击“导入 JSON”。';
      configTransferIsError = false;
    }

    function importConfigJson(rawValue) {
      try {
        if (!String(rawValue).trim()) throw new Error('请先粘贴配置 JSON。');
        const snapshot = JSON.parse(rawValue);
        if (!snapshot || typeof snapshot !== 'object') throw new Error('配置 JSON 的根对象无效。');
        if (snapshot.schemaVersion !== undefined && snapshot.schemaVersion !== 1) throw new Error(`不支持的配置版本：${snapshot.schemaVersion}。`);
        if (!Array.isArray(snapshot.entities)) throw new Error('配置缺少 entities 数组。');

        const usedUids = new Set();
        const usedSpawnIds = new Set();
        const usedBuildingIds = new Set();
        const nextEntities = snapshot.entities.map((entity, index) => normalizeImportedEntity(entity, index, usedUids, usedSpawnIds, usedBuildingIds));
        const sourceLayout = snapshot.layoutConfig || {};
        const validSpawnUids = new Set(nextEntities.filter((entity) => entity.type === 'spawn').map((entity) => entity.uid));
        const nextRules = Array.isArray(sourceLayout.rules)
          ? sourceLayout.rules.map((rule, index) => normalizeImportedRule(rule, index, validSpawnUids))
          : [];
        const nextTargetCount = clamp(readPositiveInteger(sourceLayout.targetCount ?? 1, '每组激活点数'), 1, 32);
        const nextMaxLayouts = clamp(readPositiveInteger(sourceLayout.maxLayouts ?? 12, '最大生成方案数'), 1, 50);

        entities.splice(0, entities.length, ...nextEntities);
        layoutConfig.targetCount = nextTargetCount;
        layoutConfig.maxLayouts = nextMaxLayouts;
        layoutConfig.rules = nextRules;
        selectedUid = null;
        invalidateGeneratedLayouts();
        configJsonText = JSON.stringify(createConfigSnapshot(), null, 2);
        configTransferMessage = '配置已导入。你可以直接生成合法布局进行测试。';
        configTransferIsError = false;
      } catch (error) {
        configTransferMessage = `导入失败：${error.message}`;
        configTransferIsError = true;
      }
    }

    function pointByUid(uid) {
      return spawnPoints().find((point) => point.uid === uid) || null;
    }

    function pointName(uid) {
      const point = pointByUid(uid);
      return point ? `GroupId ${point.groupId}` : '已删除点位';
    }

    function pointOptions(selectedUid) {
      const points = spawnPoints();
      if (!points.length) return '<option value="">暂无出生点</option>';
      return points.map((point) => `<option value="${escapeHtml(point.uid)}"${point.uid === selectedUid ? ' selected' : ''}>GroupId ${point.groupId}</option>`).join('');
    }

    function groupIdsForPointUids(pointIds) {
      return pointIds.map((uid) => pointByUid(uid)).filter(Boolean).map((point) => point.groupId).join(', ');
    }

    function updateRulePointIds(rule, rawValue) {
      const requestedIds = String(rawValue).split(/[,，]/)
        .map((value) => Number(value.trim())).filter((value) => Number.isInteger(value) && value > 0);
      const uniqueIds = [...new Set(requestedIds)];
      rule.pointIds = spawnPoints().filter((point) => uniqueIds.includes(point.groupId)).map((point) => point.uid);
      rule.invalidGroupIds = uniqueIds.filter((groupId) => !spawnPoints().some((point) => point.groupId === groupId));
    }

    function createCountRule() {
      return {
        id: makeRuleId(),
        type: 'count',
        scope: 'points',
        pointIds: spawnPoints().slice(0, 2).map((point) => point.uid),
        invalidGroupIds: [],
        tags: [],
        comparison: 'exactly',
        value: 1
      };
    }

    function createActivationRule() {
      return {
        id: makeRuleId(),
        type: 'activation',
        mode: 'required',
        pointId: spawnPoints()[0]?.uid || ''
      };
    }

    function createRelationRule() {
      const points = spawnPoints();
      return {
        id: makeRuleId(),
        type: 'relation',
        relation: 'exclusive',
        sourceId: points[0]?.uid || '',
        targetId: points[1]?.uid || ''
      };
    }

    function comparisonLabel(comparison) {
      return { exactly: '恰好', atLeast: '至少', atMost: '至多' }[comparison] || '恰好';
    }

    function relationLabel(relation) {
      return {
        exclusive: '互斥',
        bound: '双向绑定',
        requires: '出现时要求目标出现',
        disables: '出现时关闭目标'
      }[relation] || '互斥';
    }

    function ruleDescription(rule) {
      if (rule.type === 'activation') {
        return `${pointName(rule.pointId)} ${rule.mode === 'required' ? '必须激活' : '禁止激活'}`;
      }
      if (rule.type === 'count') {
        const subject = rule.scope === 'points'
          ? `点位 GroupId [${groupIdsForPointUids(rule.pointIds) || '未选择'}]`
          : `Tag [${rule.tags.join(', ') || '未填写'}]`;
        return `${subject} ${comparisonLabel(rule.comparison)}激活 ${rule.value} 个`;
      }
      return `${pointName(rule.sourceId)} 与 ${pointName(rule.targetId)}：${relationLabel(rule.relation)}`;
    }

    function renderRuleCard(rule) {
      if (rule.type === 'activation') {
        return `
          <article class="rule-card">
            <div class="rule-card-head"><strong>点位状态约束</strong><button class="btn danger" type="button" data-action="remove-rule" data-rule-id="${rule.id}">删除</button></div>
            <div class="rule-row">
              <div class="field"><label>规则</label><select data-rule-id="${rule.id}" data-rule-field="mode"><option value="required"${rule.mode === 'required' ? ' selected' : ''}>必须激活</option><option value="blocked"${rule.mode === 'blocked' ? ' selected' : ''}>禁止激活</option></select></div>
              <div class="field"><label>出生点</label><select data-rule-id="${rule.id}" data-rule-field="pointId">${pointOptions(rule.pointId)}</select></div>
            </div>
            <p class="rule-description">${escapeHtml(ruleDescription(rule))}</p>
          </article>`;
      }

      if (rule.type === 'count') {
        const subjectField = rule.scope === 'points'
          ? `<div class="field"><label>GroupId（逗号分隔）</label><input data-rule-id="${rule.id}" data-rule-field="pointIds" type="text" value="${escapeHtml(groupIdsForPointUids(rule.pointIds))}" placeholder="例如：1, 3, 5"></div>`
          : `<div class="field"><label>Tags（逗号分隔）</label><input data-rule-id="${rule.id}" data-rule-field="tags" type="text" value="${escapeHtml(rule.tags.join(', '))}" placeholder="例如：EdgeLoot, CoreAnchor"></div>`;
        const missingPoints = rule.invalidGroupIds?.length ? `<p class="rule-description">未找到 GroupId：${rule.invalidGroupIds.join(', ')}</p>` : '';
        return `
          <article class="rule-card">
            <div class="rule-card-head"><strong>数量约束</strong><button class="btn danger" type="button" data-action="remove-rule" data-rule-id="${rule.id}">删除</button></div>
            <div class="rule-row">
              <div class="field"><label>对象</label><select data-rule-id="${rule.id}" data-rule-field="scope"><option value="points"${rule.scope === 'points' ? ' selected' : ''}>指定点位</option><option value="tags"${rule.scope === 'tags' ? ' selected' : ''}>带指定 Tag 的点位</option></select></div>
              <div class="field"><label>条件</label><select data-rule-id="${rule.id}" data-rule-field="comparison"><option value="exactly"${rule.comparison === 'exactly' ? ' selected' : ''}>恰好选</option><option value="atLeast"${rule.comparison === 'atLeast' ? ' selected' : ''}>至少选</option><option value="atMost"${rule.comparison === 'atMost' ? ' selected' : ''}>至多选</option></select></div>
            </div>
            <div class="rule-row">
              ${subjectField}
              <div class="field"><label>数量</label><input data-rule-id="${rule.id}" data-rule-field="value" type="number" min="0" max="32" step="1" value="${rule.value}"></div>
            </div>
            <p class="rule-description">${escapeHtml(ruleDescription(rule))}</p>${missingPoints}
          </article>`;
      }

      return `
        <article class="rule-card">
          <div class="rule-card-head"><strong>点位关系约束</strong><button class="btn danger" type="button" data-action="remove-rule" data-rule-id="${rule.id}">删除</button></div>
          <div class="rule-row">
            <div class="field"><label>起点</label><select data-rule-id="${rule.id}" data-rule-field="sourceId">${pointOptions(rule.sourceId)}</select></div>
            <div class="field"><label>关系</label><select data-rule-id="${rule.id}" data-rule-field="relation"><option value="exclusive"${rule.relation === 'exclusive' ? ' selected' : ''}>互斥</option><option value="bound"${rule.relation === 'bound' ? ' selected' : ''}>双向绑定</option><option value="requires"${rule.relation === 'requires' ? ' selected' : ''}>出现则目标出现</option><option value="disables"${rule.relation === 'disables' ? ' selected' : ''}>出现则关闭目标</option></select></div>
          </div>
          <div class="field"><label>目标</label><select data-rule-id="${rule.id}" data-rule-field="targetId">${pointOptions(rule.targetId)}</select></div>
          <p class="rule-description">${escapeHtml(ruleDescription(rule))}</p>
        </article>`;
    }

    function configErrors() {
      const points = spawnPoints();
      const errors = [];
      if (!points.length) errors.push('至少需要一个出生点才能生成布局。');
      if (layoutConfig.targetCount < 1) errors.push('每组激活点数必须至少为 1。');
      if (layoutConfig.targetCount > points.length) errors.push(`当前只有 ${points.length} 个出生点，无法生成 ${layoutConfig.targetCount} 点布局。`);
      layoutConfig.rules.forEach((rule) => {
        if (rule.type === 'activation' && !pointByUid(rule.pointId)) errors.push('点位状态约束引用了不存在的出生点。');
        if (rule.type === 'count') {
          if (rule.scope === 'points' && (!rule.pointIds.length || rule.invalidGroupIds?.length)) errors.push('数量约束需要引用至少一个存在的 GroupId。');
          if (rule.scope === 'tags' && !rule.tags.length) errors.push('Tag 数量约束需要至少填写一个 Tag。');
        }
        if (rule.type === 'relation') {
          if (!pointByUid(rule.sourceId) || !pointByUid(rule.targetId)) errors.push('点位关系约束引用了不存在的出生点。');
          else if (rule.sourceId === rule.targetId) errors.push('点位关系约束的起点和目标不能相同。');
        }
      });
      return errors;
    }

    function evaluateLayout(points) {
      const activeIds = new Set(points.map((point) => point.uid));
      const violations = [];
      layoutConfig.rules.forEach((rule) => {
        if (rule.type === 'activation') {
          const active = activeIds.has(rule.pointId);
          if ((rule.mode === 'required' && !active) || (rule.mode === 'blocked' && active)) violations.push(ruleDescription(rule));
          return;
        }
        if (rule.type === 'count') {
          const count = rule.scope === 'points'
            ? points.filter((point) => rule.pointIds.includes(point.uid)).length
            : points.filter((point) => tagsMatch(point, rule.tags)).length;
          const matched = (rule.comparison === 'exactly' && count === rule.value)
            || (rule.comparison === 'atLeast' && count >= rule.value)
            || (rule.comparison === 'atMost' && count <= rule.value);
          if (!matched) violations.push(ruleDescription(rule));
          return;
        }
        const sourceActive = activeIds.has(rule.sourceId);
        const targetActive = activeIds.has(rule.targetId);
        const matched = (rule.relation === 'exclusive' && !(sourceActive && targetActive))
          || (rule.relation === 'bound' && sourceActive === targetActive)
          || (rule.relation === 'requires' && (!sourceActive || targetActive))
          || (rule.relation === 'disables' && (!sourceActive || !targetActive));
        if (!matched) violations.push(ruleDescription(rule));
      });
      return violations;
    }

    function generateLayouts() {
      const errors = configErrors();
      if (errors.length) {
        generatedLayouts = { errors, layouts: [], examined: 0, validCount: 0, reasons: new Map() };
        selectedLayoutIndex = null;
        return;
      }

      const points = spawnPoints();
      const layouts = [];
      const reasons = new Map();
      let examined = 0;
      let validCount = 0;
      let truncated = false;
      const maxCandidates = 50000;

      function visit(startIndex, selectedPoints) {
        if (examined >= maxCandidates) {
          truncated = true;
          return;
        }
        if (selectedPoints.length === layoutConfig.targetCount) {
          examined += 1;
          const violations = evaluateLayout(selectedPoints);
          if (!violations.length) {
            validCount += 1;
            if (layouts.length < layoutConfig.maxLayouts) {
              layouts.push({
                points: [...selectedPoints],
                logs: layoutConfig.rules.length ? layoutConfig.rules.map((rule) => `满足：${ruleDescription(rule)}`) : ['未配置额外约束']
              });
            }
          } else {
            violations.forEach((violation) => reasons.set(violation, (reasons.get(violation) || 0) + 1));
          }
          return;
        }
        const remainingNeeded = layoutConfig.targetCount - selectedPoints.length;
        for (let index = startIndex; index <= points.length - remainingNeeded; index += 1) {
          selectedPoints.push(points[index]);
          visit(index + 1, selectedPoints);
          selectedPoints.pop();
          if (truncated) return;
        }
      }

      visit(0, []);
      generatedLayouts = { errors: [], layouts, examined, validCount, reasons, truncated };
      selectedLayoutIndex = null;
    }

    function renderLayoutResults() {
      if (!generatedLayouts) return '<p class="result-message">配置完成后，点击“生成合法布局”查看候选出生点组。</p>';
      if (generatedLayouts.errors.length) return `<p class="result-message">无法生成：${generatedLayouts.errors.map(escapeHtml).join('；')}</p>`;
      if (!generatedLayouts.validCount) {
        const commonReasons = [...generatedLayouts.reasons.entries()].sort((left, right) => right[1] - left[1]).slice(0, 3)
          .map(([reason]) => escapeHtml(reason)).join('；');
        return `<p class="result-message">已检查 ${generatedLayouts.examined} 个候选组合，没有符合条件的布局。${commonReasons ? `常见冲突：${commonReasons}` : ''}</p>`;
      }
      const summary = `<p class="result-message">已检查 ${generatedLayouts.examined} 个候选组合，找到 ${generatedLayouts.validCount} 个合法布局；当前显示前 ${generatedLayouts.layouts.length} 个。</p>`;
      const cards = generatedLayouts.layouts.map((layout, index) => {
        const pointText = layout.points.map((point) => {
          const tags = point.tags.length ? point.tags.map((tag) => `<span class="tag-chip">${escapeHtml(tag)}</span>`).join('') : '<span class="tag-chip">未设置 Tag</span>';
          return `<div>GroupId ${point.groupId}：${tags}</div>`;
        }).join('');
        return `<article class="layout-result"><strong>方案 ${index + 1} · GroupId ${layout.points.map((point) => point.groupId).join('、')}</strong><div class="layout-points">${pointText}</div><p>规则日志：${layout.logs.map(escapeHtml).join('；')}</p></article>`;
      }).join('');
      const truncated = generatedLayouts.truncated ? '<p class="result-message">候选组合超过 50,000 个，已停止继续枚举。</p>' : '';
      return `${summary}<div class="layout-results">${cards}</div>${truncated}`;
    }

    function renderGlobalConfig() {
      layoutConfigElement.innerHTML = `
        <div class="config-grid">
          <div class="field"><label for="target-count">每组激活点数</label><input id="target-count" data-layout-field="targetCount" type="number" min="1" max="32" step="1" value="${layoutConfig.targetCount}"></div>
          <div class="field"><label for="max-layouts">最大生成方案数</label><input id="max-layouts" data-layout-field="maxLayouts" type="number" min="1" max="50" step="1" value="${layoutConfig.maxLayouts}"></div>
        </div>
        <button class="btn primary" type="button" data-action="generate-layouts">生成合法布局</button>
        <div class="section-actions">
          <button class="btn" type="button" data-action="add-activation-rule">＋ 点位状态</button>
          <button class="btn" type="button" data-action="add-count-rule">＋ 数量约束</button>
          <button class="btn" type="button" data-action="add-relation-rule">＋ 点位关系</button>
        </div>
        <div>${layoutConfig.rules.length ? layoutConfig.rules.map(renderRuleCard).join('') : '<p class="empty-rule">尚无额外约束：将从全部出生点中生成指定数量的组合。</p>'}</div>
        ${renderLayoutResults()}
        <div class="rule-card config-transfer">
          <div class="rule-card-head"><strong>保存 / 恢复测试配置</strong></div>
          <p class="rule-description">JSON 包含出生点、建筑物、Tags 和全部全局布局约束。导入不会自动写入文件。</p>
          <div class="field"><label for="config-json">配置 JSON</label><textarea id="config-json" spellcheck="false" placeholder="点击“生成 JSON”后复制，或在此粘贴已有配置。">${escapeHtml(configJsonText)}</textarea></div>
          <div class="transfer-actions">
            <button class="btn" type="button" data-action="export-config">生成 JSON</button>
            <button class="btn primary" type="button" data-action="import-config">导入 JSON</button>
          </div>
          <p class="transfer-message${configTransferIsError ? ' error' : ''}">${escapeHtml(configTransferMessage)}</p>
        </div>`;
      applyGlobalEditingLock();
    }

    function applyGlobalEditingLock() {
      layoutConfigElement.querySelectorAll('input, select').forEach((element) => { element.disabled = isEditingLocked; });
      layoutConfigElement.querySelectorAll('textarea').forEach((element) => { element.readOnly = isEditingLocked; });
      layoutConfigElement.querySelectorAll('button[data-action]').forEach((button) => {
        button.disabled = isEditingLocked && !['generate-layouts', 'export-config'].includes(button.dataset.action);
      });
    }

    function updateRule(rule, field, rawValue) {
      if (field === 'pointIds') updateRulePointIds(rule, rawValue);
      else if (field === 'tags') rule.tags = normalizeTags(rawValue);
      else if (field === 'value') rule.value = clamp(Math.round(Number(rawValue) || 0), 0, 32);
      else rule[field] = rawValue;
      invalidateGeneratedLayouts();
    }

    function pruneRulesForDeletedPoint(uid) {
      layoutConfig.rules = layoutConfig.rules.flatMap((rule) => {
        if (rule.type === 'activation' && rule.pointId === uid) return [];
        if (rule.type === 'relation' && (rule.sourceId === uid || rule.targetId === uid)) return [];
        if (rule.type === 'count') rule.pointIds = rule.pointIds.filter((pointId) => pointId !== uid);
        return [rule];
      });
      invalidateGeneratedLayouts();
    }

    layoutConfigElement.addEventListener('click', (event) => {
      const actionTarget = event.target.closest('[data-action]');
      if (!actionTarget) return;
      const { action, ruleId } = actionTarget.dataset;
      if (isEditingLocked && !['generate-layouts', 'export-config'].includes(action)) {
        configTransferMessage = '编辑已锁定。解锁后才能修改或导入配置。';
        configTransferIsError = true;
        renderGlobalConfig();
        return;
      }
      if (action === 'export-config') {
        exportConfigJson();
        renderGlobalConfig();
        return;
      }
      if (action === 'import-config') {
        const jsonInput = layoutConfigElement.querySelector('#config-json');
        importConfigJson(jsonInput ? jsonInput.value : '');
        render();
        return;
      }
      if (action === 'generate-layouts') generateLayouts();
      if (action === 'add-activation-rule') layoutConfig.rules.push(createActivationRule());
      if (action === 'add-count-rule') layoutConfig.rules.push(createCountRule());
      if (action === 'add-relation-rule') layoutConfig.rules.push(createRelationRule());
      if (action === 'remove-rule') layoutConfig.rules = layoutConfig.rules.filter((rule) => rule.id !== ruleId);
      if (action !== 'generate-layouts') invalidateGeneratedLayouts();
      render();
    });

    layoutConfigElement.addEventListener('change', (event) => {
      if (isEditingLocked) return;
      const input = event.target;
      const layoutField = input.dataset.layoutField;
      if (layoutField) {
        const maximum = layoutField === 'maxLayouts' ? 50 : 32;
        layoutConfig[layoutField] = clamp(Math.round(Number(input.value) || 1), 1, maximum);
        invalidateGeneratedLayouts();
        render();
        return;
      }
      const rule = layoutConfig.rules.find((item) => item.id === input.dataset.ruleId);
      if (!rule) return;
      updateRule(rule, input.dataset.ruleField, input.value);
      render();
    });

    layoutListElement.addEventListener('click', (event) => {
      const clearButton = event.target.closest('[data-clear-layout-highlight]');
      if (clearButton) {
        selectedLayoutIndex = null;
        renderMap();
        renderLayoutList();
        return;
      }
      const layoutButton = event.target.closest('[data-layout-index]');
      if (!layoutButton || !generatedLayouts) return;
      const layoutIndex = Number(layoutButton.dataset.layoutIndex);
      if (!Number.isInteger(layoutIndex) || !generatedLayouts.layouts[layoutIndex]) return;
      selectedLayoutIndex = layoutIndex;
      renderMap();
      renderLayoutList();
    });

    editLockButton.addEventListener('click', () => {
      isEditingLocked = !isEditingLocked;
      dragging = null;
      render();
    });

    document.getElementById('add-spawn').addEventListener('click', () => {
      if (isEditingLocked) return;
      const groupId = nextId({ type: 'spawn', field: 'groupId' });
      const entity = { uid: `spawn-${Date.now()}`, type: 'spawn', groupId, x: 50, y: 48, tags: [] };
      entities.push(entity);
      selectedUid = entity.uid;
      invalidateGeneratedLayouts();
      render();
    });

    document.getElementById('add-building').addEventListener('click', () => {
      if (isEditingLocked) return;
      const buildingId = nextId({ type: 'building', field: 'buildingId' });
      const entity = { uid: `building-${Date.now()}`, type: 'building', buildingId, x: 52, y: 52, w: 180, h: 80 };
      entities.push(entity);
      selectedUid = entity.uid;
      invalidateGeneratedLayouts();
      render();
    });

    deleteButton.addEventListener('click', () => {
      if (isEditingLocked) return;
      const index = entities.findIndex((entity) => entity.uid === selectedUid);
      if (index < 0) return;
      const [deletedEntity] = entities.splice(index, 1);
      if (deletedEntity.type === 'spawn') pruneRulesForDeletedPoint(deletedEntity.uid);
      selectedUid = null;
      render();
    });

    map.addEventListener('pointerdown', (event) => {
      if (event.button === 2) {
        beginPan(event);
        return;
      }
      if (!event.target.closest('[data-entity]')) {
        selectedUid = null;
        render();
      }
    });

    map.addEventListener('wheel', zoomMap, { passive: false });
    map.addEventListener('contextmenu', (event) => event.preventDefault());

    window.addEventListener('pointermove', moveEntity);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
    render();
    applyView();
  </script>
</body>
</html>
